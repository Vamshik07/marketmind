<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3CB8B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A7A7A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle (darker teal) -->
  <circle cx="100" cy="120" r="70" fill="#1A7A7A"/>
  
  <!-- Upper circle (lighter teal) -->
  <ellipse cx="100" cy="70" rx="75" ry="45" fill="#3CB8B8"/>
  
  <!-- White trend line (zigzag upward) -->
  <path d="M 45 110 L 70 95 L 90 105 L 110 85 L 135 75" 
        stroke="white" 
        stroke-width="10" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Upward arrow -->
  <g transform="translate(155, 50) rotate(30)">
    <path d="M 0 0 L 25 -15 L 30 -5 L 15 5 L 20 15 Z" 
          fill="#3CB8B8"/>
  </g>
  
  <!-- Arrow shaft -->
  <line x1="130" y1="80" x2="155" y2="55" 
        stroke="#3CB8B8" 
        stroke-width="8" 
        stroke-linecap="round"/>
</svg>