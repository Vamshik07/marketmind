<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MarketAI Suite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/autofill-override.css') }}">
    <style>
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 30px transparent inset !important;
            -webkit-text-fill-color: #f0f4ff !important;
            background: transparent !important;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Forgot password</h1>
            <p class="auth-subtitle">Enter your email and we'll send you a link to reset your password.</p>
        </div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label class="input-label" for="email">Email Address</label>
                <div class="input-shell">
                    <input type="email" id="email" name="email" class="auth-input" placeholder="Enter your email" data-lpignore="true" data-form-type="other" required>
                </div>
            </div>

            <button type="submit" class="auth-btn">Send Reset Link</button>
        </form>

        <script>
            document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = document.getElementById('email').value;
                
                try {
                    const response = await fetch('/forgot-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({email})
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        window.location.href = '/password-reset-sent';
                    } else {
                        alert('Request failed: ' + data.message);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                }
            });
        </script>

        <div class="auth-footer">
            <a href="{{ url_for('login_page') }}">← Back to Sign In</a>
        </div>
    </div>
</body>
</html>
