<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - MarketAI Suite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/autofill-override.css') }}">
    <style>
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 30px transparent inset !important;
            -webkit-text-fill-color: #f0f4ff !important;
            background: transparent !important;
        }
    </style>
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-header">
        <h1 class="auth-title">Log in</h1>
        <p class="auth-subtitle">Log in to your account and seamlessly continue managing your projects, ideas, and progress just where you left off.</p>
    </div>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <!-- IMPORTANT: autocomplete OFF -->
    <form id="loginForm" autocomplete="off">

        <!-- Dummy fields to stop browser autofill -->
        <input type="text" style="display:none">
        <input type="password" style="display:none">

        <div class="form-group">
            <label class="input-label" for="email">Email Address</label>
            <div class="input-shell">
                <input
                    type="email"
                    id="email"
                    class="auth-input"
                    placeholder="Enter your email"
                    autocomplete="off"
                    data-lpignore="true"
                    data-form-type="other"
                    required
                >
            </div>
        </div>

        <div class="form-group">
            <label class="input-label" for="password">Password</label>
            <div class="input-shell">
                <input
                    type="password"
                    id="password"
                    class="auth-input"
                    placeholder="Enter your password"
                    autocomplete="off"
                    data-lpignore="true"
                    data-form-type="other"
                    required
                >
            </div>
        </div>

        <div class="form-footer">
            <label>
                <input type="checkbox"> Remember me
            </label>
            <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
        </div>

        <button type="submit" class="auth-btn">Sign In</button>
    </form>

    <div class="auth-footer">
        Don't have an account? <a href="{{ url_for('signup') }}">Create one</a>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        if (data.success) {
            window.location.href = '/';
        } else {
            alert(data.message || 'Login failed');
        }
    } catch (err) {
        alert('Something went wrong');
    }
});

document.querySelectorAll('.toggle-password').forEach(btn => {
    btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        if (!target) return;
        const isPassword = target.type === 'password';
        target.type = isPassword ? 'text' : 'password';
        btn.textContent = isPassword ? '🙈' : '👁';
    });
});
</script>

</body>
</html>
