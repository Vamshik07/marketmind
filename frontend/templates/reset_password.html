<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MarketAI Suite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/autofill-override.css') }}">
    <style>
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 30px transparent inset !important;
            -webkit-text-fill-color: #f0f4ff !important;
            background: transparent !important;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Reset password</h1>
            <p class="auth-subtitle">Enter your new password below to reset your account access.</p>
        </div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form id="resetPasswordForm">
            <div class="form-group">
                <label class="input-label" for="new_password">New Password</label>
                <div class="input-shell">
                    <input type="password" id="new_password" name="new_password" class="auth-input" placeholder="Create a new password" data-lpignore="true" data-form-type="other" required>
                </div>
            </div>

            <div class="password-rules">
                <h4>Password Requirements:</h4>
                <ul>
                    <li>More than 7 characters</li>
                    <li>At least 1 digit (0-9)</li>
                </ul>
            </div>

            <div class="form-group">
                <label class="input-label" for="new_password_confirm">Confirm Password</label>
                <div class="input-shell">
                    <input type="password" id="new_password_confirm" name="new_password_confirm" class="auth-input" placeholder="Confirm your password" data-lpignore="true" data-form-type="other" required>
                </div>
            </div>

            <button type="submit" class="auth-btn">Reset Password</button>
        </form>

        <script>
            document.querySelectorAll('.toggle-password').forEach(btn => {
                btn.addEventListener('click', () => {
                    const target = document.getElementById(btn.dataset.target);
                    if (!target) return;
                    const isPassword = target.type === 'password';
                    target.type = isPassword ? 'text' : 'password';
                    btn.textContent = isPassword ? '🙈' : '👁';
                });
            });

            document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const new_password = document.getElementById('new_password').value;
                const new_password_confirm = document.getElementById('new_password_confirm').value;
                const token = "{{ token }}";
                
                if (new_password !== new_password_confirm) {
                    alert('Passwords do not match!');
                    return;
                }
                
                try {
                    const response = await fetch('/reset-password/' + token, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({new_password, new_password_confirm})
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        window.location.href = '/reset-password-success';
                    } else {
                        alert('Reset failed: ' + data.message);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                }
            });
        </script>

        <div class="auth-footer">
            <a href="{{ url_for('login_page') }}">← Back to Sign In</a>
        </div>
    </div>
</body>
</html>
