<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MarketAI Suite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/autofill-override.css') }}">
    <style>
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 30px transparent inset !important;
            -webkit-text-fill-color: #f0f4ff !important;
            background: transparent !important;
        }
    </style>
</head>

<body class="auth-page">
<div class="auth-container">
    <div class="auth-header">
        <h1 class="auth-title">Sign up</h1>
        <p class="auth-subtitle">Create your account and start managing your marketing projects today.</p>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form id="signupForm">

        <div class="form-group">
            <label class="input-label" for="name">Full Name</label>
            <div class="input-shell">
                <input type="text" id="name" name="name" class="auth-input" placeholder="Enter your full name" value="{{ name or '' }}" data-lpignore="true" data-form-type="other" required>
            </div>
        </div>

        <div class="form-group">
            <label class="input-label" for="email">Email Address</label>
            <div class="input-shell">
                <input type="email" id="email" name="email" class="auth-input" placeholder="Enter your email" value="{{ email or '' }}" data-lpignore="true" data-form-type="other" required>
            </div>
        </div>

        <!-- 🔐 PASSWORD -->
        <div class="form-group">
            <label class="input-label" for="password">Password</label>
            <div class="input-shell">
                <input type="password" id="password" name="password" class="auth-input" placeholder="Create a password" data-lpignore="true" data-form-type="other" required>
            </div>
        </div>

        <div class="password-rules">
            <h4>Password Requirements:</h4>
            <ul>
                <li>More than 7 characters</li>
                <li>At least 1 digit (0-9)</li>
            </ul>
        </div>

        <!-- 🔐 CONFIRM PASSWORD -->
        <div class="form-group">
            <label class="sr-only" for="password_confirm">Confirm Password</label>
            <div class="input-shell">
                <input type="password" id="password_confirm" name="password_confirm" class="auth-input" placeholder="Confirm your password" data-lpignore="true" data-form-type="other" required>
            </div>
        </div>

        <button type="submit" class="auth-btn">Create Account</button>
    </form>

    <!-- 🔥 SHOW / HIDE SCRIPT -->
    <script>
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = document.getElementById(btn.dataset.target);
                if (!target) return;
                const isPassword = target.type === 'password';
                target.type = isPassword ? 'text' : 'password';
                btn.textContent = isPassword ? '🙈' : '👁';
            });
        });

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const password_confirm = document.getElementById('password_confirm').value;

            if (password !== password_confirm) {
                alert('Passwords do not match!');
                return;
            }

            const response = await fetch('/signup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, email, password, password_confirm })
            });

            const data = await response.json();
            if (data.success) {
                window.location.href = '/verification-pending';
            } else {
                alert(data.message);
            }
        });
    </script>

    <div class="auth-footer">
        Already have an account? <a href="{{ url_for('login_page') }}">Sign In</a>
    </div>
</div>
</body>
</html>
